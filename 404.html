<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found</title>
    <style>
        @font-face {
            font-family: "font";
            src:url("font.woff2") format("woff2");
            font-weight: normal;
            font-style: normal;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #0060ff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-family: "SimHei", "STHeiti", "Heiti SC", "Microsoft YaHei", sans-serif;
        }

        .message-container {
            text-align: center;
            margin-top: -8vh;
            width: 100%;
        }

        .main-text,
        .sub-text {
            display: block;
            font-size: 5.2vw;
            font-weight: normal;
            letter-spacing: 0.05em;
            line-height: 1.4;
            margin-bottom: 2vh;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .text404 {
            font-family: "font";
            display: block;
            font-size: 3vw;
            font-weight: normal;
            letter-spacing: 0.15em;
            line-height: 1.4;
            margin-bottom: 2vh;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .error {
            color: #ff3737;
            text-shadow: 
                0 0 8px rgba(255, 0, 0, 0.6),
                0 0 16px rgba(255, 0, 0, 0.5);
        }

        .footer {
            position: absolute;
            bottom: 15vh;
            right: 10vw;
            width: 28vw;
        }

        .footer-text {
            display: block;
            font-size: 1.6vw;
            line-height: 1.8;
            text-align: justify;
            text-align-last: justify;
            -moz-text-align-last: justify;
        }

        @media (max-width: 768px) {
            .main-text,
            .sub-text {
                font-size: 32px;
                letter-spacing: 0.02em;
            }
            .footer {
                width: 240px;
                bottom: 10vh;
                right: 5vw;
            }
            .footer-text {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="message-container">
        <div class="text404">
            <span class="error">Error </span>
            <span class="error">404</span>
        </div>
        <div class="main-text">此计算机因违规外联已被阻断</div>
        <div class="sub-text">请等待安全部门与你联系</div>
    </div>

    <div class="footer">
        <div class="footer-text">中央保密委员会办公室</div>
        <div class="footer-text">中央密码工作领导小组办公室</div>
    </div>

    <script>
        (function() {
            let isFullscreen = false;

            function enterFullscreen() {
                if (isFullscreen) return;
                const el = document.documentElement;
                if (el.requestFullscreen) {
                    el.requestFullscreen()
                        .then(() => { isFullscreen = true; })
                        .catch(() => { /* 自动全屏被拒绝，静默处理 */ });
                } else if (el.webkitRequestFullscreen) {
                    el.webkitRequestFullscreen();
                    isFullscreen = true;
                } else if (el.mozRequestFullScreen) {
                    el.mozRequestFullScreen();
                    isFullscreen = true;
                } else if (el.msRequestFullscreen) {
                    el.msRequestFullscreen();
                    isFullscreen = true;
                }
            }

            // 页面加载后尝试自动全屏
            document.addEventListener('DOMContentLoaded', enterFullscreen);

            // 如果自动全屏被阻止，用户点击页面任意位置也可触发全屏
            document.addEventListener('click', enterFullscreen);
        })();
    </script>
</body>
</html>
