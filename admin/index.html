<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>管理后台 · BH6RKW</title>
    <link rel="stylesheet" href="admin.css?v=2.1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</head>
<body>

    <!-- ========== 登录界面 ========== -->
    <div id="loginContainer" class="login-container" data-layout="dual" data-theme="dark">
        <!-- ... 登录界面内容与之前相同，此处省略 ... -->
    </div>

    <!-- ========== 管理面板（带侧边栏） ========== -->
    <div id="dashboardContainer" class="dashboard-container" style="display:none;">
        <!-- 侧边栏 -->
        <aside class="dashboard-sidebar">
            <div class="sidebar-brand">
                <h1>BH6RKW</h1>
                <span>管理后台</span>
            </div>

            <nav class="sidebar-nav">
                <!-- 考试管理 -->
                <div class="nav-group">
                    <button class="nav-group-toggle" data-group="exam">
                        <i class="fas fa-graduation-cap"></i>
                        <span>考试管理</span>
                        <i class="fas fa-chevron-down group-arrow"></i>
                    </button>
                    <ul class="nav-group-items" data-group="exam">
                        <li><a href="#" data-page="exam_pending"><i class="fas fa-clock"></i> 待审批</a></li>
                        <li><a href="#" data-page="exam_progress"><i class="fas fa-chart-line"></i> 考试进度</a></li>
                        <li><a href="#" data-page="exam_sessions"><i class="fas fa-calendar-alt"></i> 考试场次</a></li>
                    </ul>
                </div>

                <!-- 日志管理 -->
                <div class="nav-group">
                    <button class="nav-group-toggle" data-group="log">
                        <i class="fas fa-history"></i>
                        <span>日志管理</span>
                        <i class="fas fa-chevron-down group-arrow"></i>
                    </button>
                    <ul class="nav-group-items" data-group="log">
                        <li><a href="#" data-page="login_logs"><i class="fas fa-sign-in-alt"></i> 登录日志</a></li>
                    </ul>
                </div>

                <!-- QSL卡片管理 -->
                <div class="nav-group">
                    <button class="nav-group-toggle" data-group="qsl">
                        <i class="fas fa-id-card"></i>
                        <span>QSL卡片管理</span>
                        <i class="fas fa-chevron-down group-arrow"></i>
                    </button>
                    <ul class="nav-group-items" data-group="qsl">
                        <li><a href="#" data-page="qsl_cards"><i class="fas fa-images"></i> 所有卡片</a></li>
                    </ul>
                </div>
            </nav>

            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <span id="sidebarAdminName">管理员</span>
                    <small id="sidebarAdminEmail">admin@email.com</small>
                </div>
                <button id="sidebarLogoutBtn" class="btn-logout sidebar-logout">
                    <i class="fas fa-sign-out-alt"></i> 退出
                </button>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="dashboard-main">
            <header class="dashboard-header">
                <div class="header-left">
                    <button class="sidebar-toggle" id="sidebarToggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h2 id="pageTitle">概览</h2>
                </div>
                <div class="header-right">
                    <span id="headerAdminName"></span>
                </div>
            </header>

            <div class="dashboard-content" id="dashboardContent">
                <!-- 默认概览 -->
                <div id="page-overview" class="page-content active">
                    <div class="stats-grid">
                        <div class="stat-card">
                            <i class="fas fa-users"></i>
                            <div><h3>用户总数</h3><p id="totalUsers">--</p></div>
                        </div>
                        <div class="stat-card">
                            <i class="fas fa-file-alt"></i>
                            <div><h3>文章数</h3><p id="totalPosts">--</p></div>
                        </div>
                        <div class="stat-card">
                            <i class="fas fa-comments"></i>
                            <div><h3>留言</h3><p id="totalComments">--</p></div>
                        </div>
                    </div>
                    <section class="welcome-section">
                        <h2>欢迎回来，<span id="dashboardAdminName"></span></h2>
                        <p>这里是 BH6RKW 网站管理面板，选择左侧菜单开始管理。</p>
                    </section>
                </div>

                <!-- 各表格页面（由 JS 动态渲染） -->
                <div id="page-exam_pending" class="page-content" data-table="exam_pending">
                    <div class="page-header"><h3>待审批列表</h3></div>
                    <div class="table-container"><table><thead><tr><th>ID</th><th>用户</th><th>申请时间</th><th>状态</th><th>操作</th></tr></thead><tbody><tr><td colspan="5" class="text-center text-muted">加载中...</td></tr></tbody></table></div>
                </div>
                <div id="page-exam_progress" class="page-content" data-table="exam_progress">
                    <div class="page-header"><h3>考试进度</h3></div>
                    <div class="table-container"><table><thead><tr><th>ID</th><th>用户</th><th>考试名称</th><th>进度</th><th>更新时间</th></tr></thead><tbody><tr><td colspan="5" class="text-center text-muted">加载中...</td></tr></tbody></table></div>
                </div>
                <div id="page-exam_sessions" class="page-content" data-table="exam_sessions">
                    <div class="page-header"><h3>考试场次</h3></div>
                    <div class="table-container"><table><thead><tr><th>ID</th><th>场次名称</th><th>日期</th><th>地点</th><th>状态</th></tr></thead><tbody><tr><td colspan="5" class="text-center text-muted">加载中...</td></tr></tbody></table></div>
                </div>
                <div id="page-login_logs" class="page-content" data-table="login_logs">
                    <div class="page-header"><h3>登录日志</h3></div>
                    <div class="table-container"><table><thead><tr><th>ID</th><th>用户ID</th><th>IP地址</th><th>登录时间</th></tr></thead><tbody><tr><td colspan="4" class="text-center text-muted">加载中...</td></tr></tbody></table></div>
                </div>
                <div id="page-qsl_cards" class="page-content" data-table="qsl_cards">
                    <div class="page-header"><h3>QSL卡片列表</h3></div>
                    <div class="table-container"><table><thead><tr><th>ID</th><th>标题</th><th>上传者</th><th>上传时间</th><th>操作</th></tr></thead><tbody><tr><td colspan="5" class="text-center text-muted">加载中...</td></tr></tbody></table></div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="admin-auth.js?v=2.1.0"></script>
    <script src="admin-theme.js?v=2.1.0"></script>
    <script src="admin-dashboard.js?v=2.1.0"></script>
</body>
</html>
