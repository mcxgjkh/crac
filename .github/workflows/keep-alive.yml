name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 6 * * *'    # 每天 UTC 06:00（北京时间 14:00）
  workflow_dispatch:       # 支持手动触发

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase via REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          TABLE_NAME="exam_sessions"
          echo "Pinging table: $TABLE_NAME"
          
          curl -X GET \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/$TABLE_NAME?select=id&limit=1" \
            --fail \
            --silent \
            --output /dev/null
          
          if [ $? -eq 0 ]; then
            echo "✅ Supabase ping successful at $(date -u)"
          else
            echo "❌ Ping failed, please check table name and secrets"
            exit 1
          fi