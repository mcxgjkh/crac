                        <li><a href="https://wap.miit.gov.cn/jgsj/wgj/index.html"><i class="fas fa-angle-right me-2"></i> 国家无线电管理局</a></li>
                        <li><a href="http://crac.org.cn"><i class="fas fa-angle-right me-2"></i> 中国无线电协会</a></li>
                        <li><a href="https://qrz.com"><i class="fas fa-angle-right me-2"></i> QRZ</a></li>
                    </ul>
                </div>
            </div>
            <div class="footer-bottom text-center">
                <p>版权所有 © 2025-2026 BH6RKW</p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const themeSwitch = document.querySelector('.theme-switch__checkbox');

            function switchToDarkTheme() { document.body.classList.add('dark-theme'); }
            function switchToLightTheme() { document.body.classList.remove('dark-theme'); }

            const hour = new Date().getHours();
            if (themeSwitch) themeSwitch.checked = !(hour >= 6 && hour < 18);
            (hour >= 6 && hour < 18) ? switchToLightTheme() : switchToDarkTheme();

            if (themeSwitch) {
                themeSwitch.addEventListener('change', function() {
                    this.checked ? switchToDarkTheme() : switchToLightTheme();
                });
            }

            const params = new URLSearchParams(window.location.search);
            const file = params.get('file') || '';
            const query = params.get('q') || '';

            const titleEl = document.getElementById('viewerTitle');
            const metaEl = document.getElementById('viewerMeta');
            const contentEl = document.getElementById('viewerContent');
            const loadingBox = document.getElementById('loadingBox');

            function highlightAll(text, q) {
                if (!q) return escapeHtml(text);
                const escaped = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const regex = new RegExp(`(${escaped})`, 'gi');
                return escapeHtml(text).replace(regex, '<mark>$1</mark>');
            }

            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            function displayContent(title, text) {
                titleEl.textContent = title;
                metaEl.textContent = '字数：' + text.length + ' | ' + (query ? '搜索关键词：' + query : '全文浏览');
                contentEl.innerHTML = highlightAll(text, query);
                loadingBox.style.display = 'none';
                contentEl.style.display = 'block';
                document.title = 'BH6RKW - ' + title;
            }

            function showError(msg) {
                titleEl.textContent = '加载失败';
                loadingBox.innerHTML = '<i class="fas fa-exclamation-triangle" style="font-size:3rem;color:#e74c3c;"></i><p>' + msg + '</p>';
            }

            async function loadContent() {
                if (!file) {
                    showError('未指定法规文件。');
                    return;
                }

                try {
                    var stored = sessionStorage.getItem('lawIndex');
                    if (stored) {
                        var index = JSON.parse(stored);
                        var entry = index.find(function(e) { return e.file === file; });
                        if (entry && entry.content) {
                            displayContent(entry.title, entry.content);
                            appendImageIfNeeded(file);
                            return;
                        }
                    }
                } catch(e) {}

                if (file.endsWith('.doc')) {
                    titleEl.textContent = file.replace('.doc', '');
                    metaEl.textContent = 'DOC 文档（含表格）';
                    loadingBox.innerHTML = '<i class="fas fa-table" style="font-size:3rem;color:var(--primary-blue);"></i><p style="max-width:500px;margin:15px auto;line-height:1.8;">此文件为 DOC 格式，内含复杂表格，无法在线解码预览。<br>请在政策法规页面搜索关键词定位相关内容后，下载原文件对照查看。</p><a href="' + file + '" download class="btn btn-primary mt-2"><i class="fas fa-download me-2"></i>下载原文件</a><br><a href="index.html" class="back-link mt-3 d-inline-block"><i class="fas fa-arrow-left me-1"></i>返回政策法规</a>';
                    return;
                }

                try {
                    const resp = await fetch(file);
                    if (!resp.ok) throw new Error('HTTP ' + resp.status);
                    const text = await resp.text();
                    displayContent(file.replace('.txt', ''), text.trim() || '(文件内容为空)');
                    appendImageIfNeeded(file);
                } catch(e) {
                    showError('无法读取文件：' + e.message);
                }
            }

            function appendImageIfNeeded(file) {
                if (file.indexOf('业余无线电台呼号编制和核发要求') !== -1) {
                    var img = document.createElement('img');
                    img.src = '/images/业余无线电台呼号编制和核发要求.webp';
                    img.alt = '业余无线电台呼号编制和核发要求附表';
                    img.style.maxWidth = '100%';
                    img.style.marginTop = '30px';
                    img.style.borderRadius = '8px';
                    img.style.boxShadow = '0 3px 10px rgba(0,0,0,0.1)';
                    contentEl.appendChild(img);

                    var caption = document.createElement('p');
                    caption.className = 'viewer-meta';
                    caption.style.marginTop = '8px';
                    caption.textContent = '▲ 各省、自治区、直辖市无线电管理机构可核发的业余无线电台呼号号段表';
                    contentEl.appendChild(caption);
                }
            }

            loadContent();
        });
    </script>
</body>
</html>
